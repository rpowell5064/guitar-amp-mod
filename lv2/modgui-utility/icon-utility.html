<div class="mod-pedal mod-pedal-guitaramp-utility{{{cns}}} ">
    <div mod-role="drag-handle" class="mod-drag-handle"></div>

    <div class="mod-powerswitch" mod-role="bypass">
        <div class="mod-powerswitch-image" mod-role="bypass-light"></div>
    </div>

    <div class="hx-header">
        <div class="hx-brand"><span class="hx-mark"></span>HEX CHAIN</div>
        <div class="hx-title">INPUT TRIM</div>
        <div class="hx-tag">gain · phase · hum filter</div>
    </div>

    <div class="mod-control-group mod-knobs clearfix">
        {{#controls.0}}<div class="mod-knob" title="{{name}}"><div class="mod-knob-image" mod-role="input-control-port" mod-port-symbol="{{symbol}}"></div><span class="mod-knob-title">{{name}}</span><span class="mod-knob-value" mod-role="input-control-value" mod-port-symbol="{{symbol}}"></span></div>{{/controls.0}}
        {{#controls.1}}<div class="mod-switch" title="{{name}}"><div class="mod-switch-image" mod-role="input-control-port" mod-port-symbol="{{symbol}}" mod-widget="switch"></div><span class="mod-switch-title">{{name}}</span></div>{{/controls.1}}
        {{#controls.2}}<div class="mod-switch" title="{{name}}"><div class="mod-switch-image" mod-role="input-control-port" mod-port-symbol="{{symbol}}" mod-widget="switch"></div><span class="mod-switch-title">{{name}}</span></div>{{/controls.2}}
    </div>

    <div class="hx-logo"></div>

    <div class="mod-pedal-input">
        {{#effect.ports.audio.input}}
        <div class="mod-input mod-input-disconnected" title="{{name}}" mod-role="input-audio-port" mod-port-symbol="{{symbol}}">
            <div class="mod-pedal-input-image"></div>
        </div>
        {{/effect.ports.audio.input}}
    </div>
    <div class="mod-pedal-output">
        {{#effect.ports.audio.output}}
        <div class="mod-output mod-output-disconnected" title="{{name}}" mod-role="output-audio-port" mod-port-symbol="{{symbol}}">
            <div class="mod-pedal-output-image"></div>
        </div>
        {{/effect.ports.audio.output}}
    </div>
</div>
