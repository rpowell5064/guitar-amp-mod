name: Build & Release (pi-Stomp aarch64)

# Builds the portable aarch64 Hex Chain LV2 bundle and, when a v* tag is pushed,
# publishes it as a GitHub Release. Runs on a free arm64 hosted runner (public
# repos), so the bundle is native aarch64.
#
# NOTE: the DSP engine lives in the PRIVATE submodule `GuitarAmpSimulator`, which
# the default GITHUB_TOKEN cannot read. For CI to build you must add a repo secret
# `SUBMODULE_TOKEN` = a (fine-grained) PAT with read access to that repo. Without it
# the submodule checkout fails — build the tarball on the Pi instead
# (`bash build-tools/package_bundle.sh <ver>`) and upload it to the release manually.

on:
  # The DSP repo (guitar-amp-simulator) is now PUBLIC, so CI can build with the
  # default token. Pushing a v* tag auto-builds the aarch64 bundle and publishes
  # the GitHub Release.
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for a manual build (e.g. 1.1.0)'
        required: false
        default: '0.0.0-dev'
      publish_patchstorage:
        description: 'Also upload the per-plugin bundles to PatchStorage'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          # Falls back to the default token if SUBMODULE_TOKEN is not set (works
          # only if the submodule repo is public).
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake build-essential pkg-config lv2-dev git ca-certificates

      - name: Determine version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "ver=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "ver=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build portable aarch64 bundle
        run: bash build-tools/package_bundle.sh "${{ steps.ver.outputs.ver }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: guitaramp-suite-aarch64
          path: dist/*.tar.gz

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz \
            --title "Hex Chain ${GITHUB_REF_NAME}" \
            --notes "Portable aarch64 (armv8-a) build of the Hex Chain LV2 suite for MOD / pi-Stomp (11 plugins incl. Hex Forge). Extract on your Pi and run \`install.sh\`. Dual-licensed **GPL-3.0-or-later + commercial** — see LICENSING.md."

  # ── PatchStorage per-plugin bundles for all three LV2 build targets ───────────
  # Produces dist/patchstorage/<target>/<plugin>.lv2 + plugins.json + LISTINGS.md,
  # ready for the patchstorage-lv2-uploader. NAM is hidden (stripped from the TTL)
  # on the 32-bit target. The upload-patchstorage job below publishes these.
  patchstorage:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runs-on: ubuntu-24.04
            mode: native
          - target: rpi-aarch64
            runs-on: ubuntu-24.04-arm
            mode: native
          - target: patchbox-os-arm32
            runs-on: ubuntu-24.04-arm
            mode: arm32-container
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}

      # Native targets (linux-amd64, rpi-aarch64): build straight on the runner.
      - name: Install build dependencies (native)
        if: matrix.mode == 'native'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake build-essential pkg-config lv2-dev python3 git ca-certificates
      - name: Build per-plugin bundles (native)
        if: matrix.mode == 'native'
        run: bash build-tools/patchstorage/build_target.sh "${{ matrix.target }}"

      # 32-bit target: build natively inside an armv7 (arm32v7) Debian container so
      # the .so files are genuine 32-bit ARM. binfmt lets the arm64 runner execute
      # the 32-bit userspace. Checkout/metadata run on the host (JS actions need a
      # host-arch node), only the compile runs in the container.
      - name: Set up binfmt (arm32)
        if: matrix.mode == 'arm32-container'
        uses: docker/setup-qemu-action@v3
      - name: Build per-plugin bundles (arm32 container)
        if: matrix.mode == 'arm32-container'
        run: |
          docker run --rm -v "$PWD:/src" -w /src arm32v7/debian:bookworm bash -c '
            set -e
            apt-get update
            apt-get install -y --no-install-recommends \
              cmake build-essential pkg-config lv2-dev python3 git ca-certificates
            git config --global --add safe.directory /src
            git config --global --add safe.directory "*"
            bash build-tools/patchstorage/build_target.sh patchbox-os-arm32
          '
          # the container writes dist/ as root — hand it back so the host metadata
          # step (runner user) can write plugins.json / LISTINGS.md into it.
          sudo chown -R "$(id -u):$(id -g)" dist

      - name: Generate listing metadata
        run: |
          python3 build-tools/patchstorage/generate_metadata.py \
            --target "${{ matrix.target }}" --out "dist/patchstorage/${{ matrix.target }}"

      - name: Upload PatchStorage bundles
        uses: actions/upload-artifact@v4
        with:
          name: patchstorage-${{ matrix.target }}
          path: dist/patchstorage/${{ matrix.target }}

  # ── Publish the per-plugin bundles to PatchStorage.com ────────────────────────
  # Runs after the three target builds, on a v* tag OR a manual dispatch with
  # publish_patchstorage=true. No-ops (skips) unless the PATCH_USERNAME /
  # PATCH_PASSWORD secrets are set. The uploader exchanges username+password
  # for a Bearer token at /auth/token; GitHub masks the secret in logs. The uploader
  # skips bundles already owned by another user and updates the maintainer's own.
  upload-patchstorage:
    needs: patchstorage
    if: ${{ github.ref_type == 'tag' || inputs.publish_patchstorage }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard — require PatchStorage credentials
        id: guard
        env:
          PS_USER: ${{ secrets.PATCH_USERNAME }}
          PS_PASS: ${{ secrets.PATCH_PASSWORD }}
        run: |
          if [ -z "$PS_USER" ] || [ -z "$PS_PASS" ]; then
            echo "PATCH_USERNAME / PATCH_PASSWORD not set — skipping upload."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all target bundles
        if: steps.guard.outputs.go == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: patchstorage-*
          path: ps-artifacts

      - name: Set up Python
        if: steps.guard.outputs.go == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Lay out the uploader tree
        if: steps.guard.outputs.go == 'true'
        run: |
          set -e
          git clone --depth 1 https://github.com/patchstorage/patchstorage-lv2-uploader uploader
          # the uploader has no requirements.txt; its third-party imports are these
          pip install -q click rdflib requests
          for t in linux-amd64 rpi-aarch64 patchbox-os-arm32; do
            mkdir -p "uploader/plugins/$t"
            cp -r ps-artifacts/patchstorage-$t/*.lv2 "uploader/plugins/$t/"
          done
          # fold our license/category/source overrides into the uploader's plugins.json
          python build-tools/patchstorage/merge_plugins_json.py \
            --uploader uploader/plugins.json \
            --ours ps-artifacts/patchstorage-rpi-aarch64/plugins.json

      - name: Prepare bundles (generate patchstorage.json + tars)
        if: steps.guard.outputs.go == 'true'
        working-directory: uploader
        run: |
          # The uploader prints "Prepared: N" / "Failed: M" and exits 0 either way,
          # so inspect the output and fail the job if any bundle failed.
          out=$(python ./uploader.py prepare all < /dev/null 2>&1) || true
          echo "$out"
          if echo "$out" | grep -qE "Failed: [1-9]"; then
            echo "::error::prepare reported failures — see log"; exit 1; fi
          if ! echo "$out" | grep -qE "Prepared: [1-9]"; then
            echo "::error::prepare produced 0 bundles"; exit 1; fi

      - name: Push to PatchStorage
        if: steps.guard.outputs.go == 'true'
        working-directory: uploader
        env:
          PS_USER: ${{ secrets.PATCH_USERNAME }}
          PS_PASS: ${{ secrets.PATCH_PASSWORD }}
        run: |
          # Same deal — push exits 0 even on per-plugin errors. Fail on error
          # markers; "Published:" lines confirm real uploads ("Skip:" is benign).
          # --auto: non-interactively create new listings and update existing ones
          # when version/targets differ (adds the new arch targets); no TTY prompts.
          out=$(python ./uploader.py push all --auto --username "$PS_USER" --password "$PS_PASS" < /dev/null 2>&1) || true
          echo "$out"
          if echo "$out" | grep -qiE "^Error:|Traceback|Failed to"; then
            echo "::error::push reported errors — see log"; exit 1; fi
          echo "Published $(echo "$out" | grep -c 'Published:') bundle(s); skipped $(echo "$out" | grep -c 'Skip:')."
